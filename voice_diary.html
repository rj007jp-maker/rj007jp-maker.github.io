<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声入力日記</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 520px; margin: 0 auto; color: #222; }
        button { font-size: 1rem; padding: 10px 18px; margin-right: 8px; margin-bottom: 8px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #f7f7f7; }
        button:hover:not(:disabled) { background: #eee; }
        button:disabled { opacity: 0.5; cursor: default; }
        textarea { width: 100%; height: 230px; margin-top: 15px; font-size: 1rem; box-sizing: border-box; padding: 10px; font-family: inherit; }
        .status { margin-top: 10px; color: #666; font-size: 0.9rem; font-weight: bold; }
        .drive-status { margin-top: 6px; color: #1a73e8; font-size: 0.85rem; min-height: 1.2em; }
        .row { margin-top: 10px; }
        .primary-btn { background: #1a73e8; color: white; border: none; }
        .primary-btn:disabled { background: #a9c6f2; color: white; }

        /* タブ */
        .tabs { display: flex; gap: 0; border-bottom: 2px solid #ddd; margin-bottom: 16px; }
        .tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; border: none; background: none;
               margin: 0; border-radius: 0; font-size: 1rem; color: #666; }
        .tab.active { color: #1a73e8; font-weight: bold; box-shadow: inset 0 -3px 0 #1a73e8; }
        .panel { display: none; }
        .panel.active { display: block; }

        /* カレンダー */
        .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .cal-title { font-size: 1.1rem; font-weight: bold; }
        .cal-nav { padding: 6px 14px; margin: 0; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .cal-dow { text-align: center; font-size: 0.8rem; color: #888; padding: 4px 0; }
        .cal-dow.sun { color: #d93025; }
        .cal-dow.sat { color: #1a73e8; }
        .cal-cell { aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                    border: 1px solid #eee; border-radius: 6px; font-size: 0.9rem; background: #fff; cursor: pointer; }
        .cal-cell:hover { background: #f3f6fd; }
        .cal-cell.empty { border: none; background: none; cursor: default; }
        .cal-cell.has-entry { background: #e8f0fe; border-color: #1a73e8; font-weight: bold; color: #1a73e8; }
        .cal-cell.has-entry:hover { background: #d2e3fc; }
        .cal-cell.today { outline: 2px solid #f9ab00; outline-offset: -2px; }
        .cal-cell.selected { background: #1a73e8; color: #fff; }
        .dot { width: 5px; height: 5px; border-radius: 50%; background: #1a73e8; margin-top: 3px; }
        .cal-cell.selected .dot { background: #fff; }
        .cal-cell.sun span.daynum, .cal-cell.holiday span.daynum { color: #d93025; }
        .cal-cell.sat span.daynum { color: #1a73e8; }
        .cal-cell.selected span.daynum { color: #fff; }
        .cal-cell .holiday-mark { font-size: 0.55rem; color: #d93025; line-height: 1; margin-top: 1px; }
        .cal-cell.selected .holiday-mark { color: #ffd6d2; }

        /* 検索結果 */
        .search-result { border: 1px solid #ddd; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
        .search-result:hover { background: #f3f6fd; border-color: #1a73e8; }
        .search-result .sr-date { font-weight: bold; color: #1a73e8; font-size: 0.9rem; margin-bottom: 4px; }
        .search-result .sr-source { font-size: 0.75rem; color: #888; margin-left: 6px; font-weight: normal; }
        .search-result .sr-snippet { font-size: 0.9rem; color: #333; line-height: 1.5; }
        .search-result mark { background: #fff59d; padding: 0 2px; }

        .editor { margin-top: 20px; }
        .editor h3 { margin: 0 0 8px; font-size: 1rem; }
        #calEditArea { height: 180px; margin-top: 8px; }
        .muted { color: #888; font-size: 0.9rem; }
        .legend { font-size: 0.8rem; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

<h2>音声入力日記</h2>

<div class="tabs">
    <button class="tab active" id="tabWrite">今日を書く</button>
    <button class="tab" id="tabCalendar">カレンダー</button>
    <button class="tab" id="tabSearch">検索</button>
</div>

<!-- ========== 書くパネル（今日専用・音声入力） ========== -->
<div class="panel active" id="panelWrite">
    <div>
        <button id="startBtn">録音開始</button>
        <button id="stopBtn" disabled>停止</button>
    </div>
    <p id="status" class="status">ボタンを押して話し始めてください</p>

    <textarea id="diaryArea" placeholder="ここに日記が入力されます..."></textarea>

    <div class="row">
        <button id="saveBtn">端末に保存</button>
        <button id="driveSignInBtn">Googleドライブに接続</button>
        <button id="driveSaveBtn" class="primary-btn" disabled>ドライブに保存</button>
    </div>
    <p id="driveStatus" class="drive-status"></p>
</div>

<!-- ========== カレンダーパネル（任意の日を読み書き） ========== -->
<div class="panel" id="panelCalendar">
    <div class="cal-header">
        <button class="cal-nav" id="prevMonth">◀</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" id="nextMonth">▶</button>
    </div>
    <div class="cal-grid" id="calDow"></div>
    <div class="cal-grid" id="calGrid"></div>
    <p class="legend">青い日付が日記のある日です。どの日をクリックしても、その日の日記を書いたり読み返したりできます。</p>
    <div class="row">
        <button id="refreshDriveBtn">ドライブから読み込む</button>
    </div>
    <p id="calStatus" class="drive-status"></p>

    <div class="editor">
        <h3 id="editorTitle">日付を選んでください</h3>
        <div class="row">
            <button id="calStartBtn" disabled>録音開始</button>
            <button id="calStopBtn" disabled>停止</button>
        </div>
        <p id="calRecStatus" class="status"></p>
        <textarea id="calEditArea" placeholder="日付をクリックすると、ここに日記を書き込めます..." disabled></textarea>
        <div class="row">
            <button id="calLocalSaveBtn" disabled>端末に保存</button>
            <button id="calDriveSaveBtn" class="primary-btn" disabled>ドライブに保存</button>
        </div>
        <p id="editorStatus" class="drive-status"></p>
    </div>
</div>

<!-- ========== 検索パネル ========== -->
<div class="panel" id="panelSearch">
    <div class="row">
        <input type="text" id="searchInput" placeholder="キーワードを入力..."
               style="width:100%; box-sizing:border-box; padding:10px; font-size:1rem; margin-bottom:8px;">
        <button id="searchBtn" class="primary-btn">検索</button>
    </div>
    <p id="searchStatus" class="drive-status"></p>
    <div id="searchResults"></div>
</div>

<script>
/* =========================================================
   設定
   ========================================================= */
const CLIENT_ID = '601356272619-t96fpja50tpa1v0br6c1igae4uvi9ks0.apps.googleusercontent.com';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';

/* ---------- 共通 ---------- */
function toKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const todayKey = toKey(new Date());

const diaryArea = document.getElementById('diaryArea');
const driveStatus = document.getElementById('driveStatus');
const calStatus = document.getElementById('calStatus');

// ページ読み込み時に今日の日記を復元（「今日を書く」タブ）
const savedDiary = localStorage.getItem(`diary_${todayKey}`);
if (savedDiary) diaryArea.value = savedDiary;

diaryArea.addEventListener('input', () => autoSaveLocal(todayKey, diaryArea.value));

/* ---------- 自動保存（端末）----------
   「保存」ボタンを押し忘れても、入力するたびに自動でlocalStorageに保存する。
   入力のたびに毎回書き込むと重いので、少し間を置いてから保存（デバウンス）。 */
function debounce(fn, delay) {
    let timer;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

const autoSaveLocal = debounce((key, value) => {
    if (!key) return;
    localStorage.setItem(`diary_${key}`, value);
}, 600);

// カレンダー編集エリア用: 保存したあと、青印を反映するためカレンダーも再描画する
const autoSaveCalendarLocal = debounce((key, value) => {
    if (!key) return;
    localStorage.setItem(`diary_${key}`, value);
    renderCalendar();
}, 600);

// タブを閉じる・リロードする直前にも、念のため今の内容を確実に保存しておく
function flushLocalSave() {
    localStorage.setItem(`diary_${todayKey}`, diaryArea.value);
    if (typeof selectedKey !== 'undefined' && selectedKey) {
        localStorage.setItem(`diary_${selectedKey}`, calEditArea.value);
    }
}
window.addEventListener('beforeunload', flushLocalSave);
window.addEventListener('pagehide', flushLocalSave);

/* ---------- タブ切り替え ---------- */
const tabWrite = document.getElementById('tabWrite');
const tabCalendar = document.getElementById('tabCalendar');
const tabSearch = document.getElementById('tabSearch');
const panelWrite = document.getElementById('panelWrite');
const panelCalendar = document.getElementById('panelCalendar');
const panelSearch = document.getElementById('panelSearch');

tabWrite.addEventListener('click', () => switchTab('write'));
tabCalendar.addEventListener('click', () => switchTab('calendar'));
tabSearch.addEventListener('click', () => switchTab('search'));

function switchTab(which) {
    const map = {
        write: [tabWrite, panelWrite],
        calendar: [tabCalendar, panelCalendar],
        search: [tabSearch, panelSearch],
    };
    Object.entries(map).forEach(([name, [tabEl, panelEl]]) => {
        const active = name === which;
        tabEl.classList.toggle('active', active);
        panelEl.classList.toggle('active', active);
    });
    if (which === 'calendar') renderCalendar();
    // カレンダー側で録音中のままタブを離れると気づきにくいので止めておく
    if (which !== 'calendar' && window.__calRecognitionStop) window.__calRecognitionStop();
}

/* =========================================================
   Googleドライブ連携（共通の保存・検索・一覧・取得関数）
   ========================================================= */
let accessToken = null;
let tokenClient = null;

const driveSignInBtn = document.getElementById('driveSignInBtn');
const driveSaveBtn = document.getElementById('driveSaveBtn');

function initGoogleAuth() {
    if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleAuth, 300);
        return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: (tokenResponse) => {
            if (tokenResponse && tokenResponse.access_token) {
                accessToken = tokenResponse.access_token;
                driveSaveBtn.disabled = false;
                calDriveSaveBtn.disabled = selectedKey === null;
                driveStatus.textContent = 'Googleドライブに接続しました。';
            } else {
                driveStatus.textContent = '接続に失敗しました。もう一度お試しください。';
            }
        },
    });
}
initGoogleAuth();

driveSignInBtn.addEventListener('click', () => {
    if (!tokenClient) {
        driveStatus.textContent = 'Google認証の準備中です。少し待ってから再度お試しください。';
        return;
    }
    tokenClient.requestAccessToken();
});

async function findFileId(fileName) {
    const query = encodeURIComponent(`name='${fileName}' and trashed=false`);
    const res = await fetch(
        `https://www.googleapis.com/drive/v3/files?q=${query}&spaces=appDataFolder&fields=files(id,name)`,
        { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (!res.ok) throw new Error(`検索に失敗しました (${res.status})`);
    const data = await res.json();
    return data.files && data.files.length > 0 ? data.files[0].id : null;
}

async function saveToDrive(fileName, content) {
    const existingId = await findFileId(fileName);
    const metadata = existingId ? { name: fileName } : { name: fileName, parents: ['appDataFolder'] };

    const boundary = 'diary_boundary_' + Date.now();
    const body =
        `--${boundary}\r\n` +
        `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
        `${JSON.stringify(metadata)}\r\n` +
        `--${boundary}\r\n` +
        `Content-Type: text/plain; charset=UTF-8\r\n\r\n` +
        `${content}\r\n` +
        `--${boundary}--`;

    const url = existingId
        ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
        : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

    const res = await fetch(url, {
        method: existingId ? 'PATCH' : 'POST',
        headers: {
            Authorization: `Bearer ${accessToken}`,
            'Content-Type': `multipart/related; boundary=${boundary}`,
        },
        body,
    });
    if (!res.ok) throw new Error(`保存に失敗しました (${res.status})`);
    const data = await res.json();
    return existingId || data.id;
}

async function listDriveDiaries() {
    let pageToken = null;
    const map = {};
    do {
        let url = `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder`
                + `&fields=nextPageToken,files(id,name)&pageSize=200`;
        if (pageToken) url += `&pageToken=${pageToken}`;
        const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
        if (!res.ok) throw new Error(`一覧取得に失敗しました (${res.status})`);
        const data = await res.json();
        (data.files || []).forEach(f => {
            const m = f.name.match(/^diary_(\d{4}-\d{2}-\d{2})\.txt$/);
            if (m) map[m[1]] = f.id;
        });
        pageToken = data.nextPageToken;
    } while (pageToken);
    return map;
}

async function fetchDriveContent(fileId) {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: `Bearer ${accessToken}` }
    });
    if (!res.ok) throw new Error(`本文の取得に失敗しました (${res.status})`);
    return res.text();
}

// 「今日を書く」タブの保存ボタン
driveSaveBtn.addEventListener('click', async () => {
    if (!accessToken) { driveStatus.textContent = '先にGoogleドライブに接続してください。'; return; }
    driveSaveBtn.disabled = true;
    driveStatus.textContent = '保存中...';
    try {
        const fileName = `diary_${todayKey}.txt`;
        const fileId = await saveToDrive(fileName, diaryArea.value);
        driveFileMap[todayKey] = fileId;
        driveContentCache[todayKey] = diaryArea.value;
        driveStatus.textContent = `Googleドライブに保存しました（${fileName}）。`;
    } catch (err) {
        console.error(err);
        driveStatus.textContent = 'エラー: ' + err.message;
    } finally {
        driveSaveBtn.disabled = false;
    }
});

/* =========================================================
   カレンダー（任意の日を選んで読み書き）
   ========================================================= */
let driveFileMap = {};              // dateKey -> fileId（ドライブ側）
let viewYear, viewMonth;
let selectedKey = null;

const calEditArea = document.getElementById('calEditArea');
const editorTitle = document.getElementById('editorTitle');
const editorStatus = document.getElementById('editorStatus');
const calLocalSaveBtn = document.getElementById('calLocalSaveBtn');
const calDriveSaveBtn = document.getElementById('calDriveSaveBtn');

calEditArea.addEventListener('input', () => {
    if (!selectedKey) return;
    autoSaveCalendarLocal(selectedKey, calEditArea.value);
});

// 日本の祝日（内閣府データ: https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html）
// R8(2026年)・R9(2027年)分。年が増えたらここに追記してください。
const HOLIDAYS = {
    // 2026年（令和8年）
    '2026-01-01': '元日',
    '2026-01-12': '成人の日',
    '2026-02-11': '建国記念の日',
    '2026-02-23': '天皇誕生日',
    '2026-03-20': '春分の日',
    '2026-04-29': '昭和の日',
    '2026-05-03': '憲法記念日',
    '2026-05-04': 'みどりの日',
    '2026-05-05': 'こどもの日',
    '2026-05-06': '休日',
    '2026-07-20': '海の日',
    '2026-08-11': '山の日',
    '2026-09-21': '敬老の日',
    '2026-09-22': '休日',
    '2026-09-23': '秋分の日',
    '2026-10-12': 'スポーツの日',
    '2026-11-03': '文化の日',
    '2026-11-23': '勤労感謝の日',
    // 2027年（令和9年）
    '2027-01-01': '元日',
    '2027-01-11': '成人の日',
    '2027-02-11': '建国記念の日',
    '2027-02-23': '天皇誕生日',
    '2027-03-21': '春分の日',
    '2027-03-22': '休日',
    '2027-04-29': '昭和の日',
    '2027-05-03': '憲法記念日',
    '2027-05-04': 'みどりの日',
    '2027-05-05': 'こどもの日',
    '2027-07-19': '海の日',
    '2027-08-11': '山の日',
    '2027-09-20': '敬老の日',
    '2027-09-23': '秋分の日',
    '2027-10-11': 'スポーツの日',
    '2027-11-03': '文化の日',
    '2027-11-23': '勤労感謝の日',
};

(function initCalendarMonth() {
    const d = new Date();
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
})();

(function renderDow() {
    const names = ['日', '月', '火', '水', '木', '金', '土'];
    const wrap = document.getElementById('calDow');
    wrap.innerHTML = names.map((n, i) =>
        `<div class="cal-dow ${i === 0 ? 'sun' : ''}${i === 6 ? 'sat' : ''}">${n}</div>`
    ).join('');
})();

function localDiaryKeys() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const m = k && k.match(/^diary_(\d{4}-\d{2}-\d{2})$/);
        if (m && (localStorage.getItem(k) || '').trim() !== '') keys.push(m[1]);
    }
    return keys;
}

function hasEntry(key) {
    return localDiaryKeys().includes(key) || Object.prototype.hasOwnProperty.call(driveFileMap, key);
}

function renderCalendar() {
    document.getElementById('calTitle').textContent = `${viewYear}年 ${viewMonth + 1}月`;

    const first = new Date(viewYear, viewMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push('<div class="cal-cell empty"></div>');

    for (let day = 1; day <= daysInMonth; day++) {
        const dateObj = new Date(viewYear, viewMonth, day);
        const key = toKey(dateObj);
        const dow = dateObj.getDay(); // 0=日, 6=土
        const holidayName = HOLIDAYS[key];

        const classes = ['cal-cell'];
        if (hasEntry(key)) classes.push('has-entry');
        if (key === todayKey) classes.push('today');
        if (key === selectedKey) classes.push('selected');
        if (dow === 0) classes.push('sun');
        if (dow === 6) classes.push('sat');
        if (holidayName) classes.push('holiday'); // 祝日は日曜と同じ赤色にする

        const dot = hasEntry(key) ? '<div class="dot"></div>' : '';
        const title = holidayName ? ` title="${holidayName}"` : '';

        cells.push(
            `<div class="${classes.join(' ')}" data-key="${key}"${title}>` +
            `<span class="daynum">${day}</span>${dot}</div>`
        );
    }

    const grid = document.getElementById('calGrid');
    grid.innerHTML = cells.join('');
    // 空白セル以外は全部クリック可能（新規作成もできるように）
    grid.querySelectorAll('.cal-cell:not(.empty)').forEach(cell => {
        cell.addEventListener('click', () => openEditor(cell.dataset.key));
    });
}

document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    renderCalendar();
});

// 一度取得したドライブの本文をキャッシュしておく（検索で再利用するため）
const driveContentCache = {};

// 日付を選んで、書き込み可能な状態にする
async function openEditor(key) {
    // 別の日付に切り替える前に、録音中なら止めておく
    if (window.__calRecognitionStop) window.__calRecognitionStop();

    selectedKey = key;
    renderCalendar();

    editorTitle.textContent = `${key} の日記`;
    calEditArea.disabled = false;
    calLocalSaveBtn.disabled = false;
    calDriveSaveBtn.disabled = !accessToken;
    document.getElementById('calStartBtn').disabled = false;
    document.getElementById('calStopBtn').disabled = true;
    document.getElementById('calRecStatus').textContent = '';
    editorStatus.textContent = '';

    // まず端末内の内容を即座に表示
    const local = localStorage.getItem(`diary_${key}`);
    calEditArea.value = local || '';
    if (local) editorStatus.textContent = '端末に保存されている内容を表示しています。';

    // ドライブ側にファイルがあれば、そちらの内容で上書き
    const fileId = driveFileMap[key];
    if (accessToken && fileId) {
        editorStatus.textContent = 'ドライブから読み込み中...';
        try {
            const text = await fetchDriveContent(fileId);
            calEditArea.value = text;
            driveContentCache[key] = text;
            editorStatus.textContent = 'ドライブの内容を表示しています。';
        } catch (err) {
            editorStatus.textContent = 'ドライブの読み込みに失敗しました: ' + err.message;
        }
    } else if (!local) {
        editorStatus.textContent = 'まだ日記がありません。書いて保存できます。';
    }
}

// 検索結果などから、特定の日付にジャンプして開く
function goToDate(key) {
    const [y, m] = key.split('-').map(Number);
    viewYear = y;
    viewMonth = m - 1;
    switchTab('calendar');
    openEditor(key);
}

calLocalSaveBtn.addEventListener('click', () => {
    if (!selectedKey) return;
    localStorage.setItem(`diary_${selectedKey}`, calEditArea.value);
    editorStatus.textContent = `端末に保存しました（${selectedKey}）。`;
    renderCalendar();
    // 「今日を書く」タブの内容とも同期
    if (selectedKey === todayKey) diaryArea.value = calEditArea.value;
});

calDriveSaveBtn.addEventListener('click', async () => {
    if (!selectedKey) return;

/* =========================================================
   検索
   ========================================================= */
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchStatus = document.getElementById('searchStatus');
const searchResults = document.getElementById('searchResults');

function escapeHtml(str) {
    return str.replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

// マッチ箇所を中心に、前後を切り出してハイライトしたHTMLスニペットを作る
function makeSnippet(content, query) {
    const idx = content.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escapeHtml(content.slice(0, 60)) + (content.length > 60 ? '…' : '');

    const start = Math.max(0, idx - 20);
    const end = Math.min(content.length, idx + query.length + 40);
    let snippet = content.slice(start, end);
    const prefix = start > 0 ? '…' : '';
    const suffix = end < content.length ? '…' : '';

    const before = escapeHtml(snippet.slice(0, idx - start));
    const match = escapeHtml(snippet.slice(idx - start, idx - start + query.length));
    const after = escapeHtml(snippet.slice(idx - start + query.length));

    return prefix + before + `<mark>${match}</mark>` + after + suffix;
}

async function performSearch() {
    const query = searchInput.value.trim();
    if (!query) {
        searchStatus.textContent = 'キーワードを入力してください。';
        searchResults.innerHTML = '';
        return;
    }

    searchBtn.disabled = true;
    searchStatus.textContent = '検索中...';
    searchResults.innerHTML = '';

    try {
        // 対象になりうる日付を全部集める（端末保存 + ドライブ一覧）
        const localKeys = localDiaryKeys();
        const allKeys = new Set([...localKeys, ...Object.keys(driveFileMap)]);

        const matches = [];
        for (const key of allKeys) {
            let content = localStorage.getItem(`diary_${key}`);

            // 端末にないがドライブにはある場合、内容を取りに行く（キャッシュ優先）
            if ((!content || content.trim() === '') && driveFileMap[key]) {
                if (driveContentCache[key] !== undefined) {
                    content = driveContentCache[key];
                } else if (accessToken) {
                    searchStatus.textContent = `検索中...（${key} をドライブから取得中）`;
                    try {
                        content = await fetchDriveContent(driveFileMap[key]);
                        driveContentCache[key] = content;
                    } catch (e) {
                        continue; // その日は諦めて次へ
                    }
                } else {
                    continue; // 未接続でドライブの内容が見られない場合はスキップ
                }
            }

            if (content && content.toLowerCase().includes(query.toLowerCase())) {
                matches.push({ key, content });
            }
        }

        matches.sort((a, b) => b.key.localeCompare(a.key)); // 新しい日付順

        if (matches.length === 0) {
            searchStatus.textContent = `「${query}」に一致する日記は見つかりませんでした。`;
        } else {
            searchStatus.textContent = `${matches.length} 件見つかりました。`;
            searchResults.innerHTML = matches.map(({ key, content }) => `
                <div class="search-result" data-key="${key}">
                    <div class="sr-date">${key}</div>
                    <div class="sr-snippet">${makeSnippet(content, query)}</div>
                </div>
            `).join('');
            searchResults.querySelectorAll('.search-result').forEach(el => {
                el.addEventListener('click', () => goToDate(el.dataset.key));
            });
        }

        if (!accessToken && Object.keys(driveFileMap).length === 0) {
            searchStatus.textContent += '（Googleドライブ未接続のため、端末に保存された日記のみ検索しています）';
        }
    } finally {
        searchBtn.disabled = false;
    }
}

searchBtn.addEventListener('click', performSearch);
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') performSearch();
});

/* =========================================================
   音声認識（「今日を書く」「カレンダー」両方で使う共通の仕組み）
   ========================================================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

// 1つのテキストエリア・ボタン一式に対して、音声認識を1セット作る関数
function setupSpeechRecognition({ textareaEl, startBtn, stopBtn, statusEl }) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = true;

    let finalTranscript = '';
    let isRecognizing = false;

    recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcript + '。';
            } else {
                interimTranscript += transcript;
            }
        }
        textareaEl.value = finalTranscript + interimTranscript;
    };

    recognition.onend = () => {
        if (isRecognizing) {
            try { recognition.start(); }
            catch (e) { console.log("再起動をスキップ:", e.message); }
        }
    };

    recognition.onerror = (event) => {
        console.error("Speech recognition error", event.error);
        if (event.error === 'not-allowed') {
            statusEl.textContent = "エラー: マイクの使用が許可されていません";
            isRecognizing = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }
    };

    startBtn.addEventListener('click', () => {
        finalTranscript = textareaEl.value;
        if (finalTranscript.length > 0 && !finalTranscript.endsWith('。') && !finalTranscript.endsWith('\n')) {
            finalTranscript += '。';
        }
        isRecognizing = true;
        recognition.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        statusEl.textContent = "🔴 音声認識中... 続けて話してください";
        statusEl.style.color = "red";
    });

    stopBtn.addEventListener('click', () => {
        isRecognizing = false;
        recognition.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusEl.textContent = "停止しました";
        statusEl.style.color = "#666";
    });

    // 外から止める用（タブ切り替え・日付切り替え時に使用）
    return {
        stop() {
            if (isRecognizing) {
                isRecognizing = false;
                recognition.stop();
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusEl.textContent = "停止しました";
                statusEl.style.color = "#666";
            }
        }
    };
}

if (!SpeechRecognition) {
    alert("お使いのブラウザは音声認識に対応していません。AndroidのChromeやPCのChrome/Edgeでお試しください。");
} else {
    const saveBtn = document.getElementById('saveBtn');

    // 「今日を書く」タブ用
    setupSpeechRecognition({
        textareaEl: diaryArea,
        startBtn: document.getElementById('startBtn'),
        stopBtn: document.getElementById('stopBtn'),
        statusEl: document.getElementById('status'),
    });

    // 「カレンダー」タブ用（最初は日付未選択なのでボタンは無効化されている）
    const calStartBtn = document.getElementById('calStartBtn');
    const calStopBtn = document.getElementById('calStopBtn');
    const calRecognition = setupSpeechRecognition({
        textareaEl: calEditArea,
        startBtn: calStartBtn,
        stopBtn: calStopBtn,
        statusEl: document.getElementById('calRecStatus'),
    });
    // openEditor などから呼べるように外に出しておく
    window.__calRecognitionStop = () => calRecognition.stop();

    saveBtn.addEventListener('click', () => {
        localStorage.setItem(`diary_${todayKey}`, diaryArea.value);
        alert(`本日（${todayKey}）の日記を保存しました！`);
    });
}
